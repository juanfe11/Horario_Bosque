<header class="bosque-navbar">
  <div class="navbar-container">
    <div class="brand-section">
      <div class="brand-logo">
        <img src="logo-universidad.png" alt="Emblema de la Universidad El Bosque" class="brand-logo-img">
      </div>
      <div class="brand-text">
        <span class="sub-title">UNIVERSIDAD EL BOSQUE · INGENIERÍA DE SISTEMAS</span>
        <h1 class="main-title">Armador Visual de Horarios</h1>
      </div>
    </div>

    <div class="controls-section">
      <div class="plan-selector-box">
        <label for="planSelect">Plan de estudios</label>
        <select id="planSelect" [ngModel]="planSeleccionado" (ngModelChange)="onSelectPlan($event)" class="form-select-sm">
          @for (p of planes; track p.id) {
            <option [value]="p.codigoPlan">{{ p.nombre }} ({{ p.totalAsignaturas }} mat.)</option>
          }
          @if (planes.length === 0) {
            <option value="PLAN-2025">Ingeniería de Sistemas - Plan 2025 (48 mat.)</option>
            <option value="PLAN-ANTERIOR">Ingeniería de Sistemas - Plan Anterior (54 mat.)</option>
          }
        </select>
      </div>

      <div class="period-badge">
        <span class="meta-label">Período</span>
        <strong>2026-2</strong>
      </div>

      <div class="stats-badge" aria-label="Resumen del horario">
        <span><span class="stat-label">Créditos</span> <strong>{{ totalCreditos }}</strong></span>
        <span><span class="stat-label">Horas/sem.</span> <strong>{{ totalHoras }}</strong></span>
      </div>
    </div>
  </div>
</header>
