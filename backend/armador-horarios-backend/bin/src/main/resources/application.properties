spring.application.name=armador-horarios-backend
server.port=8080

# Configuracion H2 en memoria para ejecucion y pruebas inmediatas
spring.datasource.url=jdbc:h2:mem:armadordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Parametros Institucionales Universidad El Bosque (Configurables segun RNF-01)
app.horario.cupo-base=40
app.horario.tolerancia=0.10
app.horario.cupo-maximo=44
app.horario.max-materias-busqueda=8
