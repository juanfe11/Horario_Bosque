spring.application.name=armador-horarios-backend
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/armadordb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:armador}
spring.datasource.password=${DB_PASSWORD:armador123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Parametros Institucionales Universidad El Bosque
app.horario.cupo-base=40
app.horario.tolerancia=0.10
app.horario.cupo-maximo=44
app.horario.max-materias-busqueda=8
